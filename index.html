<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอเพลง - Music Queue System</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- นำเข้า Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header" style="justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="logo-icon">🎵</div>
                <h1>ระบบขอเพลง <span>YouTube</span></h1>
            </div>
            <button class="add-btn" style="background: rgba(255, 255, 255, 0.1); font-size: 12px;" onclick="goToAdmin()">🔑 เข้า Admin</button>
        </header>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="วางลิงก์ YouTube หรือพิมพ์ชื่อเพลง..." oninput="handleInput(this.value)">
            <button onclick="searchMusic(document.getElementById('searchInput').value)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>

        <div id="results" class="results-list"></div>

        <div class="section-divider">
            <span>รายการคิว</span>
        </div>

        <div class="queue-header">
            <h2>📜 คิวเพลงทั้งหมด</h2>
            <span id="queueCount" class="badge">0 เพลง</span>
        </div>
        <div id="queueList" class="queue-list"></div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Modal ยืนยันตัวตน Admin -->
    <div id="adminModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>🔑</span>
                <h3>เข้าสู่ระบบ Admin</h3>
            </div>
            <p class="modal-desc">กรุณากรอกรหัสผ่านเพื่อเข้าใช้งานหน้าควบคุม</p>
            
            <div class="password-wrapper">
                <input type="password" id="adminPasswordInput" placeholder="กรอกรหัสผ่าน..." onkeyup="if(event.key==='Enter') submitAdminAuth()">
                <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()">👁️</button>
            </div>
            
            <div id="modalError" class="modal-error">⚠️ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</div>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeAdminModal()">ยกเลิก</button>
                <button class="btn-confirm" onclick="submitAdminAuth()">ยืนยัน</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC2G1uLEfuf9J1g-7B-ea5zttjWQnzobmE",
            authDomain: "music-app-ce95f.firebaseapp.com",
            databaseURL: "https://music-app-ce95f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "music-app-ce95f",
            storageBucket: "music-app-ce95f.firebasestorage.app",
            messagingSenderId: "957087797341",
            appId: "1:957087797341:wab:e9710c7c5fb3678c31fdb4"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const queueRef = db.ref('musicQueue');

        const ADMIN_PASSWORD = "1234";

        // Admin Modal Controls
        function goToAdmin() {
            const modal = document.getElementById('adminModal');
            const pwdInput = document.getElementById('adminPasswordInput');
            const errorMsg = document.getElementById('modalError');
            
            pwdInput.value = '';
            errorMsg.style.display = 'none';
            modal.classList.add('active');
            setTimeout(() => pwdInput.focus(), 100);
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('adminPasswordInput');
            const btn = document.querySelector('.toggle-pwd-btn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = '🙈';
            } else {
                input.type = 'password';
                btn.innerText = '👁️';
            }
        }

        function submitAdminAuth() {
            const inputPass = document.getElementById('adminPasswordInput').value;
            const errorMsg = document.getElementById('modalError');
            
            if (inputPass === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminAuthenticated', 'true');
                window.location.href = "admin.html";
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('adminPasswordInput').select();
            }
        }

        // Music System Controls
        let searchTimer = null;
        let currentAbortController = null;

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function handleInput(value) {
            clearTimeout(searchTimer);
            const query = value.trim();
            if (!query) {
                document.getElementById('results').innerHTML = '';
                return;
            }
            const isUrl = extractVideoId(query);
            const delay = isUrl ? 50 : 250;
            searchTimer = setTimeout(() => { searchMusic(query); }, delay);
        }

        async function searchMusic(query) {
            if (!query) return;
            if (currentAbortController) currentAbortController.abort();
            currentAbortController = new AbortController();

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div>กำลังโหลดข้อมูล...</div>';

            const videoId = extractVideoId(query);
            const apiServers = [
                'https://pipedapi.kavin.rocks',
                'https://api.piped.private.coffee',
                'https://pipedapi.mha.fi'
            ];

            let videos = [];
            if (videoId) {
                for (let server of apiServers) {
                    try {
                        const response = await fetch(`${server}/streams/${videoId}`, { signal: currentAbortController.signal });
                        if (response.ok) {
                            const data = await response.json();
                            if (data && data.title) {
                                videos.push({
                                    title: data.title,
                                    uploaderName: data.uploader || 'YouTube',
                                    videoId: videoId,
                                    thumbnail: data.thumbnailUrl || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
                                });
                                break;
                            }
                        }
                    } catch (e) {
                        if (e.name === 'AbortError') return;
                        continue;
                    }
                }
            } else {
                for (let server of apiServers) {
                    try {
                        const response = await fetch(`${server}/search?q=${encodeURIComponent(query)}&filter=videos`, { signal: currentAbortController.signal });
                        if (response.ok) {
                            const data = await response.json();
                            if (data && data.items && data.items.length > 0) {
                                videos = data.items.filter(item => item.type === 'stream').slice(0, 5).map(item => {
                                    const urlParts = item.url.split('v=');
                                    const vId = urlParts[1] || item.url.replace('/watch?v=', '');
                                    return {
                                        title: item.title,
                                        uploaderName: item.uploaderName || 'YouTube',
                                        videoId: vId,
                                        thumbnail: `https://i.ytimg.com/vi/${vId}/hqdefault.jpg`
                                    };
                                });
                                break;
                            }
                        }
                    } catch (e) {
                        if (e.name === 'AbortError') return;
                        continue;
                    }
                }
            }

            resultsDiv.innerHTML = '';
            if (videos.length === 0) {
                resultsDiv.innerHTML = '<p class="empty-msg">ไม่พบผลลัพธ์เพลง</p>';
                return;
            }

            const fragment = document.createDocumentFragment();
            videos.forEach(video => {
                const title = escapeQuotes(video.title);
                const author = escapeQuotes(video.uploaderName);
                const thumbnail = video.thumbnail;
                const youtubeUrl = `https://www.youtube.com/watch?v=${video.videoId}`;

                const songCard = document.createElement('div');
                songCard.className = 'song-card';
                songCard.innerHTML = `
                    <img src="${thumbnail}" alt="cover" loading="lazy" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'52\' height=\'52\' viewBox=\'0 0 52 52\'><rect width=\'100%\' height=\'100%\' fill=\'%232a2d3d\'/></svg>'">
                    <div class="song-info">
                        <div class="song-title">${video.title}</div>
                        <div class="song-artist">${video.uploaderName}</div>
                    </div>
                    <button class="add-btn" onclick="addToQueue('${title}', '${author}', '${thumbnail}', '${video.videoId}', '${youtubeUrl}')">
                        + ต่อคิว
                    </button>
                `;
                fragment.appendChild(songCard);
            });
            resultsDiv.appendChild(fragment);
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function addToQueue(title, artist, cover, videoId, youtubeUrl) {
            const newSongRef = queueRef.push();
            newSongRef.set({
                timestamp: Date.now(),
                title: title,
                artist: artist,
                cover: cover,
                videoId: videoId,
                youtubeUrl: youtubeUrl
            }, (error) => {
                if (!error) {
                    showToast(`เพิ่มเพลงเข้าคิวเรียบร้อย!`);
                } else {
                    alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + error.message);
                }
            });
        }

        queueRef.on('value', (snapshot) => {
            const queueDiv = document.getElementById('queueList');
            const queueCount = document.getElementById('queueCount');
            queueDiv.innerHTML = '';

            const data = snapshot.val();
            if (!data) {
                queueCount.innerText = '0 เพลง';
                queueDiv.innerHTML = '<p class="empty-msg">ยังไม่มีคิวเพลงในขณะนี้</p>';
                return;
            }

            const queueArray = Object.keys(data).map(key => ({
                firebaseKey: key,
                ...data[key]
            }));

            queueCount.innerText = `${queueArray.length} เพลง`;

            const fragment = document.createDocumentFragment();
            queueArray.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'queue-item';
                item.innerHTML = `
                    <div class="queue-num">${index + 1}</div>
                    <img src="${song.cover}" alt="cover" loading="lazy">
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                `;
                fragment.appendChild(item);
            });
            queueDiv.appendChild(fragment);
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
